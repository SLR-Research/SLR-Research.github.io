<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modul — SLR AI Guide</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.13?plugins=typography"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-base-100">
  <header class="navbar bg-base-100 border-b border-base-300 sticky top-0 z-30">
    <div class="container mx-auto px-4 flex items-center justify-between">
      <a href="/home/" class="text-sm">← Kembali ke daftar modul</a>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Keluar</button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 max-w-3xl">
    <div id="loading" class="text-center py-12 opacity-60">Memuat...</div>
    <article id="modulContent" class="hidden prose prose-lg max-w-none"></article>
    <div id="errorState" class="hidden alert alert-error text-sm"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    Auth.requireLogin();
    document.getElementById("logoutBtn").addEventListener("click", () => Auth.logout());

    const slug = new URLSearchParams(window.location.search).get("slug");
    if (!slug) {
      window.location.href = "/home/";
    }

    (async function loadModul() {
      const loading = document.getElementById("loading");
      const content = document.getElementById("modulContent");
      const errBox = document.getElementById("errorState");
      try {
        const data = await Api.get("/modul/" + encodeURIComponent(slug));
        loading.classList.add("hidden");
        // Backend mengembalikan HTML hasil render markdown (server-side).
        // Trust source: konten markdown di-curate admin, bukan user input.
        content.innerHTML = data.html_content || "";
        document.title = (data.title || slug) + " — SLR AI Guide";
        content.classList.remove("hidden");
        if (window.hljs) hljs.highlightAll();
      } catch (err) {
        loading.classList.add("hidden");
        errBox.textContent = err.message || "Gagal memuat modul";
        errBox.classList.remove("hidden");
      }
    })();
  </script>
</body>
</html>
