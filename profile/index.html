<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil — Nulis</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B19CD8%27 stroke-width=%272%27%3E%3Cpath stroke-linecap=%27round%27 stroke-linejoin=%27round%27 d=%27M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253%27/%3E%3C/svg%3E">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.13?plugins=typography"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-base-100">
  <header class="navbar bg-base-100 border-b border-base-300">
    <div class="container mx-auto px-4 flex justify-between">
      <a href="/home/" class="text-sm">← Kembali</a>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Keluar</button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 max-w-2xl space-y-6">
    <h1 class="text-2xl font-semibold">Profil</h1>

    <div id="loading" class="opacity-60">Memuat...</div>
    <div id="errorState" class="hidden alert alert-error text-sm"></div>

    <section id="content" class="hidden space-y-6">
      <div class="card bg-base-200">
        <div class="card-body">
          <h2 class="card-title text-base" id="userName">—</h2>
          <p class="text-sm opacity-80" id="userEmail">—</p>
          <p class="text-sm opacity-70 mt-2"><strong>Affiliation:</strong> <span id="userAff">—</span></p>
          <p class="text-sm opacity-70"><strong>Role:</strong> <span id="userRole">—</span></p>
          <p class="text-sm opacity-70"><strong>Bergabung:</strong> <span id="userJoined">—</span></p>
        </div>
      </div>

      <div class="card bg-base-200">
        <div class="card-body">
          <h2 class="card-title text-base">Jalur Belajar</h2>
          <p class="text-sm opacity-70 mb-3">Saat ini: <span id="currentTrack" class="font-medium">—</span></p>
          <div id="trackButtons" class="flex flex-wrap gap-2">
            <span class="text-xs opacity-50">Memuat track Anda…</span>
          </div>
          <div class="mt-3">
            <a href="/enroll/" class="link link-primary text-xs">
              <span class="material-symbols-outlined align-middle text-sm">add</span>
              Enroll track baru
            </a>
          </div>
          <p class="text-xs opacity-60 mt-3">Hanya track yang sudah Anda enroll muncul di sini. Mengganti jalur akan reset tampilan modul; progress lama tetap tersimpan.</p>
          <div id="trackMsg" class="hidden alert alert-success text-xs mt-2"></div>
          <div id="trackErr" class="hidden alert alert-error text-xs mt-2"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    Auth.requireProfile();
    document.getElementById("logoutBtn").addEventListener("click", () => Auth.logout());

    function fmtDate(s) {
      if (!s) return "—";
      try { return new Date(s).toLocaleString("id-ID"); } catch { return s; }
    }

    const TRACK_LABELS = {
      "slr": "SLR AI",
      "slr-cowork": "SLR + AI Cowork",
      "scoping": "Scoping Review",
      "scoping-cowork": "Scoping Review + AI Cowork",
      "buku": "Penulisan Buku Akademik",
      "empiris": "Riset Empiris dengan AI",
    };

    function trackLabel(slug) {
      return TRACK_LABELS[slug] || slug;
    }

    function refreshTrackUI(track) {
      document.getElementById("currentTrack").textContent = trackLabel(track) || "(belum dipilih)";
      document.querySelectorAll("#trackButtons [data-track]").forEach((b) => {
        b.classList.toggle("btn-primary", b.dataset.track === track);
      });
    }

    function buildTrackButtons(enrollments, currentTrack) {
      const container = document.getElementById("trackButtons");
      container.innerHTML = "";

      if (!enrollments || enrollments.length === 0) {
        container.innerHTML = '<span class="text-xs opacity-50">Belum ada track ter-enroll.</span>';
        return;
      }

      enrollments.forEach((e) => {
        const btn = document.createElement("button");
        btn.className = "btn btn-sm";
        btn.dataset.track = e.track;
        btn.textContent = trackLabel(e.track);
        if (e.track === currentTrack) btn.classList.add("btn-primary");
        btn.addEventListener("click", () => switchTrack(e.track));
        container.appendChild(btn);
      });
    }

    async function switchTrack(track) {
      const okBox = document.getElementById("trackMsg");
      const errBox = document.getElementById("trackErr");
      okBox.classList.add("hidden"); errBox.classList.add("hidden");
      try {
        await Api.post("/api/track", { track });
        const u = Auth.getUser() || {};
        u.selected_track = track;
        Auth.setUser(u);
        refreshTrackUI(track);
        okBox.textContent = "Jalur diubah ke: " + trackLabel(track);
        okBox.classList.remove("hidden");
      } catch (err) {
        errBox.textContent = err.message || "Gagal mengubah jalur";
        errBox.classList.remove("hidden");
      }
    }

    async function load() {
      try {
        const data = await Api.get("/me");
        const u = data.user;
        document.getElementById("userName").textContent = u.name;
        document.getElementById("userEmail").textContent = u.email;
        document.getElementById("userAff").textContent = u.affiliation || "—";
        document.getElementById("userRole").textContent = u.role;
        document.getElementById("userJoined").textContent = fmtDate(u.created_at);
        Auth.setUser(u);

        // Fetch enrollments untuk build switcher dinamis
        try {
          const enrollData = await Api.get("/api/enrollments");
          buildTrackButtons(enrollData.enrollments || [], u.selected_track || "");
        } catch (e) {
          // Fallback: tampilkan current track only kalau API fail
          const fallback = u.selected_track ? [{ track: u.selected_track }] : [];
          buildTrackButtons(fallback, u.selected_track || "");
        }

        refreshTrackUI(u.selected_track || "");
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("content").classList.remove("hidden");
      } catch (err) {
        document.getElementById("loading").classList.add("hidden");
        const errBox = document.getElementById("errorState");
        errBox.textContent = err.message || "Gagal memuat profil";
        errBox.classList.remove("hidden");
      }
    }

    load();
  </script>
</body>
</html>
