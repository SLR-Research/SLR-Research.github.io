<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'self'">
  <!-- theme-init: honor saved theme before paint (no FOUC) -->
  <script>try{var t=localStorage.getItem('slr_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Admin · Enrollments — Nulis</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B19CD8%27 stroke-width=%272%27%3E%3Cpath stroke-linecap=%27round%27 stroke-linejoin=%27round%27 d=%27M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253%27/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-base-100">

<div id="admin-nav"></div>


<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold">Enrollments</h1>
      <p class="text-sm text-base-content/60"><span id="enrollCount">—</span> enrollment ditampilkan</p>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="tabs tabs-boxed bg-base-200 inline-flex mb-4">
    <button class="tab" data-filter="">Semua</button>
    <button class="tab" data-filter="pending">Pending</button>
    <button class="tab" data-filter="trial">Trial</button>
    <button class="tab" data-filter="approved">Approved</button>
  </div>

  <select id="filterTrack" class="select select-sm select-bordered ml-2">
    <option value="">Semua track</option>
    <option value="slr">SLR AI</option>
    <option value="slr-cowork">SLR + AI Cowork</option>
    <option value="scoping">Scoping Review</option>
    <option value="scoping-cowork">Scoping Review + AI Cowork</option>
    <option value="buku">Penulisan Buku Akademik</option>
    <option value="empiris">Riset Empiris dengan AI</option>
    <option value="modul-quan">Riset Kuantitatif</option>
  </select>

  <div id="errorState" class="hidden alert alert-error my-4 text-sm"></div>
  <div id="successToast" class="hidden alert alert-success my-4 text-sm"></div>

  <div class="card bg-base-100 border border-base-200 mt-4">
    <div class="card-body p-0">
      <div id="loading" class="p-4 space-y-3" role="status" aria-busy="true" aria-label="Memuat">
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
      </div>
      <div id="emptyState" class="hidden text-center py-12">
        <span class="material-symbols-outlined text-5xl text-base-content/20 mb-4">inbox</span>
        <p class="text-base-content/50">Tidak ada enrollment dengan filter ini.</p>
      </div>
      <div id="tableWrap" class="hidden overflow-x-auto">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">User</th>
              <th scope="col">Track</th>
              <th scope="col">Status</th>
              <th scope="col">Trial Sampai</th>
              <th scope="col">Kode Dipakai</th>
              <th scope="col">Daftar</th>
              <th scope="col">Aksi</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Set Trial Modal -->
<dialog id="trialModal" class="modal">
  <div class="modal-box max-w-sm">
    <h3 class="font-bold text-lg mb-3">Set Trial</h3>
    <p class="text-sm opacity-70 mb-4" id="trialContext"></p>

    <div class="form-control">
      <label class="label"><span class="label-text font-medium">Durasi Trial (hari)</span></label>
      <input id="trialDays" type="number" class="input input-bordered" value="7" min="1" max="365">
      <label class="label"><span class="label-text-alt text-base-content/50">TrialEndsAt akan di-set ke now + N hari</span></label>
    </div>

    <div class="modal-action">
      <button class="btn" onclick="document.getElementById('trialModal').close()">Batal</button>
      <button id="confirmTrialBtn" class="btn btn-primary">Set Trial</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/admin-nav.js"></script>
<script>
Auth.requireProfile();
const u = Auth.getUser() || {};

const initialStatus = new URLSearchParams(location.search).get("status") || "";

function fmtDate(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleDateString("id-ID", {day:"2-digit",month:"short",year:"numeric"}); } catch { return s; }
}
function fmtDateTime(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleString("id-ID", {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); } catch { return s; }
}

function trackLabel(slug) {
  const map = { "slr": "SLR AI", "slr-cowork": "SLR + AI Cowork", "scoping": "Scoping Review", "scoping-cowork": "Scoping Review + AI Cowork", "buku": "Penulisan Buku Akademik", "empiris": "Riset Empiris dengan AI", "modul-quan": "Riset Kuantitatif" };
  return map[slug] || slug;
}

function showSuccess(msg) { UI.toast(msg, "success"); }
function showError(msg) { UI.toast(msg, "error"); }

let currentFilter = initialStatus;

function setActiveTab() {
  document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.classList.toggle("tab-active", btn.dataset.filter === currentFilter);
  });
}

document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    setActiveTab();
    loadEnrollments();
  });
});
document.getElementById("filterTrack").addEventListener("change", loadEnrollments);

async function loadEnrollments() {
  const loading = document.getElementById("loading");
  const tableWrap = document.getElementById("tableWrap");
  const emptyState = document.getElementById("emptyState");

  loading.classList.remove("hidden");
  tableWrap.classList.add("hidden");
  emptyState.classList.add("hidden");

  const params = new URLSearchParams();
  if (currentFilter) params.set("status", currentFilter);
  const trackF = document.getElementById("filterTrack").value;
  if (trackF) params.set("track", trackF);
  const qs = params.toString() ? "?" + params.toString() : "";

  try {
    const data = await Api.get("/admin/enrollments" + qs);
    loading.classList.add("hidden");
    const enrolls = data.enrollments || [];
    document.getElementById("enrollCount").textContent = enrolls.length;
    if (enrolls.length === 0) {
      emptyState.classList.remove("hidden");
      return;
    }
    const tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    enrolls.forEach(e => {
      const tr = document.createElement("tr");
      tr.className = "hover";
      tr.innerHTML = `
        <td>
          <div class="font-medium" data-name></div>
          <div class="text-xs text-base-content/60" data-email></div>
          <div class="text-xs text-base-content/40" data-aff></div>
        </td>
        <td><span class="badge badge-ghost badge-sm" data-track></span></td>
        <td data-statuscell></td>
        <td class="text-sm" data-trial></td>
        <td class="text-sm font-mono" data-code></td>
        <td class="text-xs text-base-content/60" data-date></td>
        <td><div class="flex gap-1" data-actions></div></td>`;

      tr.querySelector("[data-name]").textContent = e.user_name || "(no name)";
      tr.querySelector("[data-email]").textContent = e.user_email || "";
      tr.querySelector("[data-aff]").textContent = e.user_affiliation || "";
      tr.querySelector("[data-track]").textContent = trackLabel(e.track);

      // Status cell
      const statusCell = tr.querySelector("[data-statuscell]");
      let statusBadge = "";
      if (e.status === "pending") {
        statusBadge = `<span class="badge badge-warning gap-1"><span class="material-symbols-outlined text-xs">hourglass_empty</span> Pending</span>`;
      } else if (e.status === "trial" && e.is_expired_trial) {
        statusBadge = `<span class="badge badge-error gap-1"><span class="material-symbols-outlined text-xs">history_toggle_off</span> Trial Expired</span>`;
      } else if (e.status === "trial") {
        statusBadge = `<span class="badge badge-info gap-1"><span class="material-symbols-outlined text-xs">schedule</span> Trial</span>`;
      } else if (e.status === "approved") {
        statusBadge = `<span class="badge badge-success gap-1"><span class="material-symbols-outlined text-xs">verified</span> Approved</span>`;
      }
      statusCell.innerHTML = statusBadge;

      tr.querySelector("[data-trial]").textContent = e.trial_ends_at ? fmtDate(e.trial_ends_at) : "—";
      tr.querySelector("[data-code]").textContent = e.used_invite_code || "—";
      tr.querySelector("[data-date]").textContent = fmtDateTime(e.enrolled_at);

      // Action buttons depend on status
      const actions = tr.querySelector("[data-actions]");
      if (e.status !== "approved") {
        const approveBtn = document.createElement("button");
        approveBtn.className = "btn btn-success btn-xs gap-1";
        approveBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">check</span> Approve';
        approveBtn.addEventListener("click", async () => {
          if (!await UI.confirm({ title: "Approve Enrollment",
              message: `Approve ${e.user_email} untuk track ${trackLabel(e.track)}?`,
              confirmText: "Approve" })) return;
          try {
            await Api.post(`/admin/enrollments/${e.id}/approve`);
            showSuccess("Berhasil di-approve");
            loadEnrollments();
          } catch (err) { showError("Gagal approve: " + err.message); }
        });
        actions.appendChild(approveBtn);
      }

      if (e.status === "pending" || (e.status === "trial" && e.is_expired_trial)) {
        const trialBtn = document.createElement("button");
        trialBtn.className = "btn btn-info btn-xs gap-1";
        trialBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">schedule</span> Trial';
        trialBtn.addEventListener("click", () => {
          openTrialModal(e);
        });
        actions.appendChild(trialBtn);
      }

      if (e.status === "trial" && !e.is_expired_trial) {
        const extendBtn = document.createElement("button");
        extendBtn.className = "btn btn-ghost btn-xs gap-1";
        extendBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">update</span> Extend';
        extendBtn.title = "Reset trial deadline ke now+N hari";
        extendBtn.addEventListener("click", () => openTrialModal(e));
        actions.appendChild(extendBtn);
      }

      if (e.status === "approved" || e.status === "trial") {
        const revokeBtn = document.createElement("button");
        revokeBtn.className = "btn btn-error btn-outline btn-xs gap-1";
        revokeBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">block</span>';
        revokeBtn.title = "Revoke (kembalikan ke pending)";
        revokeBtn.addEventListener("click", async () => {
          if (!await UI.confirm({ title: "Revoke Akses",
              message: `Revoke akses ${e.user_email} di track ${trackLabel(e.track)}? Status akan kembali ke pending.`,
              confirmText: "Revoke", danger: true })) return;
          try {
            await Api.post(`/admin/enrollments/${e.id}/revoke`);
            showSuccess("Berhasil revoke");
            loadEnrollments();
          } catch (err) { showError("Gagal revoke: " + err.message); }
        });
        actions.appendChild(revokeBtn);
      }

      tbody.appendChild(tr);
    });
    tableWrap.classList.remove("hidden");
  } catch (err) {
    loading.classList.add("hidden");
    showError(err.status === 403 ? "Akses admin diperlukan" : (err.message || "Gagal memuat enrollment"));
  }
}

let _activeTrialEnrollId = null;
function openTrialModal(e) {
  _activeTrialEnrollId = e.id;
  document.getElementById("trialContext").textContent =
    `${e.user_email} → track ${trackLabel(e.track)}`;
  document.getElementById("trialDays").value = "7";
  document.getElementById("trialModal").showModal();
}

document.getElementById("confirmTrialBtn").addEventListener("click", async () => {
  const days = parseInt(document.getElementById("trialDays").value, 10) || 7;
  if (!_activeTrialEnrollId) return;
  try {
    await Api.post(`/admin/enrollments/${_activeTrialEnrollId}/set-trial`, { days });
    document.getElementById("trialModal").close();
    showSuccess(`Trial di-set ${days} hari`);
    loadEnrollments();
  } catch (err) {
    showError("Gagal set trial: " + err.message);
  }
});

setActiveTab();
loadEnrollments();
</script>
</body>
</html>
