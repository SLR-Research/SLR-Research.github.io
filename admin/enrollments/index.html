<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'self'">
  <!-- theme-init: honor saved theme before paint (no FOUC) -->
  <script>try{var t=localStorage.getItem('slr_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Admin · Enrollments — Nulis</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B19CD8%27 stroke-width=%272%27%3E%3Cpath stroke-linecap=%27round%27 stroke-linejoin=%27round%27 d=%27M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253%27/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-base-100">

<div id="admin-nav"></div>


<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold">Enrollments</h1>
      <p class="text-sm text-base-content/60"><span id="enrollCount">—</span> enrollment ditampilkan</p>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="tabs tabs-boxed bg-base-200 inline-flex mb-4">
    <button class="tab" data-filter="">Semua <span class="ml-1 opacity-60" data-count="all"></span></button>
    <button class="tab" data-filter="pending">Pending <span class="ml-1 opacity-60" data-count="pending"></span></button>
    <button class="tab" data-filter="trial">Trial <span class="ml-1 opacity-60" data-count="trial"></span></button>
    <button class="tab" data-filter="approved">Approved <span class="ml-1 opacity-60" data-count="approved"></span></button>
  </div>

  <select id="filterTrack" class="select select-sm select-bordered ml-2"></select>

  <div id="errorState" class="hidden alert alert-error my-4 text-sm"></div>
  <div id="successToast" class="hidden alert alert-success my-4 text-sm"></div>

  <div class="card bg-base-100 border border-base-200 mt-4">
    <div class="card-body p-0">
      <div id="loading" class="p-4 space-y-3" role="status" aria-busy="true" aria-label="Memuat">
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
        <div class="skeleton h-9 w-full"></div>
      </div>
      <div id="emptyState" class="hidden text-center py-12">
        <span class="material-symbols-outlined text-5xl text-base-content/20 mb-4">inbox</span>
        <p class="text-base-content/50">Tidak ada enrollment dengan filter ini.</p>
      </div>
      <div id="tableWrap" class="hidden overflow-x-auto">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">User</th>
              <th scope="col">Track</th>
              <th scope="col">Status</th>
              <th scope="col">Trial Sampai</th>
              <th scope="col" title="Kode yang dipakai saat mendaftar. Durasi trial ditetapkan saat itu — mengubah kodenya belakangan tidak menggeser tanggal ini.">Kode Dipakai</th>
              <th scope="col">Daftar</th>
              <th scope="col">Aksi</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="pager" class="hidden"></div>
    </div>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/pager.js"></script>
<script src="/assets/js/tracks.js"></script>
<script src="/assets/js/duration.js"></script>
<script src="/assets/js/enrollment-ui.js"></script>
<script src="/assets/js/admin-nav.js"></script>
<script>
Auth.requireAdmin();
const u = Auth.getUser() || {};

const initialStatus = new URLSearchParams(location.search).get("status") || "";

function fmtDateTime(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleString("id-ID", {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); } catch { return s; }
}

function showError(msg) { UI.toast(msg, "error"); }

let currentFilter = initialStatus;
let currentPage = 1;

function setActiveTab() {
  document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.classList.toggle("tab-active", btn.dataset.filter === currentFilter);
  });
}

document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    currentPage = 1;
    setActiveTab();
    loadEnrollments();
  });
});
document.getElementById("filterTrack").addEventListener("change", () => {
  currentPage = 1;
  loadEnrollments();
});

async function loadEnrollments() {
  const loading = document.getElementById("loading");
  const tableWrap = document.getElementById("tableWrap");
  const emptyState = document.getElementById("emptyState");

  loading.classList.remove("hidden");
  tableWrap.classList.add("hidden");
  emptyState.classList.add("hidden");

  const params = new URLSearchParams();
  if (currentFilter) params.set("status", currentFilter);
  const trackF = document.getElementById("filterTrack").value;
  if (trackF) params.set("track", trackF);
  if (currentPage > 1) params.set("page", currentPage);
  const qs = params.toString() ? "?" + params.toString() : "";

  try {
    const data = await Api.get("/admin/enrollments" + qs);
    loading.classList.add("hidden");
    // Angka per tab supaya admin tahu isi tiap antrean tanpa mengkliknya.
    // Menghormati filter track yang sedang aktif.
    const counts = data.counts || {};
    document.querySelectorAll("[data-count]").forEach((el) => {
      const n = counts[el.dataset.count];
      el.textContent = n === undefined ? "" : "(" + n + ")";
    });
    const enrolls = data.enrollments || [];
    document.getElementById("enrollCount").textContent = data.total ?? enrolls.length;
    Pager.render(document.getElementById("pager"), data, (p) => { currentPage = p; loadEnrollments(); });
    if (enrolls.length === 0) {
      emptyState.classList.remove("hidden");
      return;
    }
    const tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    enrolls.forEach(e => {
      const tr = document.createElement("tr");
      tr.className = "hover";
      tr.innerHTML = `
        <td>
          <div class="font-medium" data-name></div>
          <div class="text-xs text-base-content/60" data-email></div>
          <div class="text-xs text-base-content/40" data-aff></div>
        </td>
        <td><span class="badge badge-ghost badge-sm" data-track></span></td>
        <td data-statuscell></td>
        <td class="text-sm" data-trial></td>
        <td class="text-sm font-mono" data-code></td>
        <td class="text-xs text-base-content/60" data-date></td>
        <td><div class="flex gap-1" data-actions></div></td>`;

      tr.querySelector("[data-name]").textContent = e.user_name || "(no name)";
      tr.querySelector("[data-email]").textContent = e.user_email || "";
      tr.querySelector("[data-aff]").textContent = e.user_affiliation || "";
      tr.querySelector("[data-track]").textContent = Tracks.label(e.track);

      tr.querySelector("[data-statuscell]").appendChild(EnrollmentUI.statusBadge(e));
      EnrollmentUI.fillTrialCell(tr.querySelector("[data-trial]"), e);
      const codeCell = tr.querySelector("[data-code]");
      codeCell.textContent = e.used_invite_code || "—";
      if (e.used_invite_code) {
        codeCell.title = "Durasi trial ditetapkan saat kode ini dipakai. Mengedit kodenya sekarang tidak menggeser tanggal berakhir — pakai Extend.";
      }
      tr.querySelector("[data-date]").textContent = fmtDateTime(e.enrolled_at);
      EnrollmentUI.renderActions(tr.querySelector("[data-actions]"), e, {
        context: e.user_email,
        reload: loadEnrollments,
      });

      tbody.appendChild(tr);
    });
    tableWrap.classList.remove("hidden");
  } catch (err) {
    loading.classList.add("hidden");
    showError(err.status === 403 ? "Akses admin diperlukan" : (err.message || "Gagal memuat enrollment"));
  }
}

setActiveTab();
(async function init() {
  await Tracks.load();
  Tracks.fillSelect(document.getElementById("filterTrack"), { placeholder: "Semua track" });
  loadEnrollments();
})();
</script>
</body>
</html>
