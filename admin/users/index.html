<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Users — SLR AI Guide</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B19CD8%27 stroke-width=%272%27%3E%3Cpath stroke-linecap=%27round%27 stroke-linejoin=%27round%27 d=%27M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253%27/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.13?plugins=typography"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-base-100">

<div class="navbar bg-base-100 border-b border-base-200 sticky top-0 z-40">
  <div class="flex-1">
    <a href="/admin/dashboard/" class="flex items-center gap-2 px-4">
      <span class="material-symbols-outlined text-primary">admin_panel_settings</span>
      <span class="font-bold text-lg">Admin Panel</span>
    </a>
  </div>
  <div class="flex-none">
    <ul class="menu menu-horizontal px-1 gap-1">
      <li><a href="/admin/dashboard/"><span class="material-symbols-outlined text-sm">dashboard</span> Dashboard</a></li>
      <li><a href="/admin/users/" class="active"><span class="material-symbols-outlined text-sm">group</span> Users</a></li>
      <li><a href="/admin/progress/"><span class="material-symbols-outlined text-sm">trending_up</span> Progress</a></li>
    </ul>
    <div class="divider divider-horizontal mx-0"></div>
    <div class="flex items-center gap-2 px-2">
      <div class="avatar placeholder">
        <div class="bg-neutral text-neutral-content rounded-full w-8">
          <span class="text-xs font-bold" id="userInitials">—</span>
        </div>
      </div>
      <span class="text-sm font-medium hidden sm:inline" id="userName">—</span>
    </div>
    <a href="/modul/?slug=home" class="btn btn-ghost btn-sm" title="Kembali ke App">
      <span class="material-symbols-outlined text-sm">arrow_back</span>
    </a>
    <button id="logoutBtn" class="btn btn-ghost btn-sm" title="Logout">
      <span class="material-symbols-outlined text-sm">logout</span>
    </button>
  </div>
</div>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold">Kelola User</h1>
      <p class="text-sm text-base-content/60"><span id="userCount">—</span> user terdaftar</p>
    </div>
    <form id="searchForm" class="flex gap-2">
      <input type="text" name="q" id="searchInput" placeholder="Cari nama atau email..." class="input input-bordered input-sm w-64">
      <button type="submit" class="btn btn-sm btn-primary gap-1">
        <span class="material-symbols-outlined text-sm">search</span> Cari
      </button>
      <button type="button" id="resetBtn" class="btn btn-sm btn-ghost hidden">Reset</button>
    </form>
  </div>

  <div id="errorState" class="hidden alert alert-error mb-4 text-sm"></div>

  <div class="card bg-base-100 border border-base-200">
    <div class="card-body p-0">
      <div id="loading" class="text-center py-12 opacity-60">Memuat...</div>
      <div id="emptyState" class="hidden text-center py-12">
        <span class="material-symbols-outlined text-5xl text-base-content/20 mb-4">person_off</span>
        <p class="text-base-content/50" id="emptyMsg">Belum ada user terdaftar</p>
      </div>
      <div id="tableWrap" class="hidden overflow-x-auto">
        <table class="table">
          <thead>
            <tr>
              <th>Nama</th><th>Email</th><th>Afiliasi</th><th>Role</th><th>Status</th><th>Progress</th><th>Terdaftar</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script>
Auth.requireLogin();
const u = Auth.getUser() || {};
document.getElementById("userName").textContent = u.name || "—";
document.getElementById("userInitials").textContent = (u.name || "?").slice(0,2).toUpperCase();
document.getElementById("logoutBtn").addEventListener("click", () => Auth.logout());

function fmtDate(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleDateString("id-ID", {day:"2-digit",month:"short",year:"numeric"}); } catch { return s; }
}

const initialQ = new URLSearchParams(location.search).get("q") || "";
document.getElementById("searchInput").value = initialQ;
if (initialQ) document.getElementById("resetBtn").classList.remove("hidden");

document.getElementById("searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = document.getElementById("searchInput").value.trim();
  location.search = q ? "?q=" + encodeURIComponent(q) : "";
});
document.getElementById("resetBtn").addEventListener("click", () => location.search = "");

(async function load() {
  const errBox = document.getElementById("errorState");
  const loading = document.getElementById("loading");
  try {
    const path = "/admin/users" + (initialQ ? "?q=" + encodeURIComponent(initialQ) : "");
    const d = await Api.get(path);
    loading.classList.add("hidden");
    document.getElementById("userCount").textContent = d.count;
    const users = d.users || [];
    if (users.length === 0) {
      const empty = document.getElementById("emptyState");
      document.getElementById("emptyMsg").textContent = initialQ
        ? `Tidak ditemukan user dengan kata kunci "${initialQ}"`
        : "Belum ada user terdaftar";
      empty.classList.remove("hidden");
    } else {
      const tbody = document.getElementById("rows");
      users.forEach((u) => {
        const tr = document.createElement("tr");
        tr.className = "hover";
        tr.innerHTML = `
          <td><a class="font-medium hover:text-primary"></a></td>
          <td class="text-base-content/70 text-sm"></td>
          <td class="text-base-content/70 text-sm"></td>
          <td><span class="badge badge-sm"></span></td>
          <td><span class="badge badge-sm"></span></td>
          <td><div class="flex items-center gap-2"><progress class="progress progress-primary w-16"></progress><span class="text-xs text-base-content/60"></span></div></td>
          <td class="text-base-content/60 text-xs"></td>
          <td><a class="btn btn-ghost btn-xs gap-1"><span class="material-symbols-outlined" style="font-size:16px">visibility</span> Detail</a></td>`;
        const detailUrl = "/admin/users-detail/?id=" + encodeURIComponent(u.id);
        const tds = tr.querySelectorAll("td");
        const a = tds[0].querySelector("a");
        a.href = detailUrl;
        a.textContent = u.name || "(no name)";
        tds[1].textContent = u.email;
        tds[2].textContent = u.affiliation || "—";
        const roleBadge = tds[3].querySelector(".badge");
        roleBadge.textContent = u.role;
        roleBadge.className += " " + (u.role === "admin" ? "badge-warning" : "badge-ghost");
        const statusBadge = tds[4].querySelector(".badge");
        statusBadge.textContent = u.is_active ? "Aktif" : "Nonaktif";
        statusBadge.className += " " + (u.is_active ? "badge-success" : "badge-error");
        const completed = u.completed_count || 0;
        const max = 10;
        tds[5].querySelector("progress").value = completed;
        tds[5].querySelector("progress").max = max;
        tds[5].querySelector("span").textContent = `${completed}/${max}`;
        tds[6].textContent = fmtDate(u.created_at);
        tds[7].querySelector("a").href = detailUrl;
        tbody.appendChild(tr);
      });
      document.getElementById("tableWrap").classList.remove("hidden");
    }
  } catch (err) {
    loading.classList.add("hidden");
    errBox.textContent = err.status === 403 ? "Akses admin diperlukan" : (err.message || "Gagal memuat user");
    errBox.classList.remove("hidden");
  }
})();
</script>
</body>
</html>
