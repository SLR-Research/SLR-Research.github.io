<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'self'">
  <!-- theme-init: honor saved theme before paint (no FOUC) -->
  <script>try{var t=localStorage.getItem('slr_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Admin · Progress — Nulis</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B19CD8%27 stroke-width=%272%27%3E%3Cpath stroke-linecap=%27round%27 stroke-linejoin=%27round%27 d=%27M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253%27/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-base-100">

<div id="admin-nav"></div>


<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h1 class="text-2xl font-bold mb-6">Progress Overview</h1>

  <div id="loading" class="space-y-3" role="status" aria-busy="true" aria-label="Memuat">
    <div class="skeleton h-9 w-full"></div>
    <div class="skeleton h-9 w-full"></div>
    <div class="skeleton h-9 w-full"></div>
    <div class="skeleton h-9 w-full"></div>
    <div class="skeleton h-9 w-full"></div>
    <div class="skeleton h-9 w-full"></div>
  </div>
  <div id="errorState" class="hidden alert alert-error text-sm"></div>

  <div id="content" class="hidden space-y-6">

    <!-- Module Stats -->
    <div class="card bg-base-100 border border-base-200">
      <div class="card-body">
        <h2 class="text-lg font-semibold mb-4">Statistik Per Modul</h2>
        <div id="statsEmpty" class="hidden text-center py-8">
          <span class="material-symbols-outlined text-4xl text-base-content/20 mb-2">analytics</span>
          <p class="text-base-content/50">Belum ada data progress.</p>
        </div>
        <div id="statsTableWrap" class="hidden overflow-x-auto">
          <table class="table">
            <thead>
              <tr><th scope="col">Track</th><th scope="col">Modul</th><th scope="col">Total Kunjungan</th><th scope="col">Diselesaikan</th><th scope="col">Tingkat Penyelesaian</th></tr>
            </thead>
            <tbody id="statsRows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="card bg-base-100 border border-base-200">
      <div class="card-body">
        <h2 class="text-lg font-semibold mb-4">Aktivitas Terbaru</h2>
        <div id="actEmpty" class="hidden text-center py-8">
          <span class="material-symbols-outlined text-4xl text-base-content/20 mb-2">history</span>
          <p class="text-base-content/50">Belum ada aktivitas.</p>
        </div>
        <div id="actTableWrap" class="hidden overflow-x-auto">
          <table class="table table-sm">
            <thead>
              <tr><th scope="col">User</th><th scope="col">Track</th><th scope="col">Modul</th><th scope="col">Status</th><th scope="col">Waktu</th></tr>
            </thead>
            <tbody id="actRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/admin-nav.js"></script>
<script>
Auth.requireProfile();

function fmtDate(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleString("id-ID", {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); } catch { return s; }
}

(async function load() {
  const errBox = document.getElementById("errorState");
  try {
    const d = await Api.get("/admin/progress");
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");

    // Module stats
    const stats = d.module_stats || [];
    if (stats.length === 0) {
      document.getElementById("statsEmpty").classList.remove("hidden");
    } else {
      const rows = document.getElementById("statsRows");
      stats.forEach((s) => {
        const tr = document.createElement("tr");
        tr.className = "hover";
        tr.innerHTML = `
          <td class="text-xs"></td>
          <td class="font-medium"></td>
          <td></td>
          <td></td>
          <td><div class="flex items-center gap-2"><progress class="progress progress-primary w-24"></progress><span class="text-sm text-base-content/70"></span></div></td>`;
        const tds = tr.querySelectorAll("td");
        tds[0].textContent = s.track;
        tds[1].textContent = s.slug;
        tds[2].textContent = s.total_visits;
        tds[3].textContent = s.completions;
        tds[4].querySelector("progress").value = s.rate;
        tds[4].querySelector("progress").max = 100;
        tds[4].querySelector("span").textContent = s.rate + "%";
        rows.appendChild(tr);
      });
      document.getElementById("statsTableWrap").classList.remove("hidden");
    }

    // Activity
    const acts = d.activity || [];
    if (acts.length === 0) {
      document.getElementById("actEmpty").classList.remove("hidden");
    } else {
      const rows = document.getElementById("actRows");
      acts.forEach((a) => {
        const tr = document.createElement("tr");
        tr.className = "hover";
        tr.innerHTML = `
          <td><div><p class="font-medium text-sm"></p><p class="text-xs text-base-content/50"></p></div></td>
          <td class="text-xs"></td>
          <td class="text-sm"></td>
          <td><span class="badge badge-sm gap-1"></span></td>
          <td class="text-base-content/60 text-xs"></td>`;
        const tds = tr.querySelectorAll("td");
        tds[0].querySelector("p:nth-child(1)").textContent = a.user_name || "—";
        tds[0].querySelector("p:nth-child(2)").textContent = a.user_email || "";
        tds[1].textContent = a.track;
        tds[2].textContent = a.module_slug;
        const b = tds[3].querySelector(".badge");
        if (a.completed) {
          b.className += " badge-success";
          b.innerHTML = `<span class="material-symbols-outlined" style="font-size:12px">check</span>`;
          b.appendChild(document.createTextNode(" Selesai"));
        } else {
          b.className += " badge-ghost";
          b.textContent = "Dikunjungi";
        }
        tds[4].textContent = fmtDate(a.last_visited);
        rows.appendChild(tr);
      });
      document.getElementById("actTableWrap").classList.remove("hidden");
    }
  } catch (err) {
    document.getElementById("loading").classList.add("hidden");
    errBox.textContent = err.status === 403 ? "Akses admin diperlukan" : (err.message || "Gagal memuat data");
    errBox.classList.remove("hidden");
  }
})();
</script>
</body>
</html>
