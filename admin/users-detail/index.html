<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'self'">
  <!-- theme-init: honor saved theme before paint (no FOUC) -->
  <script>try{var t=localStorage.getItem('slr_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Admin · User Detail — Nulis</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B19CD8%27 stroke-width=%272%27%3E%3Cpath stroke-linecap=%27round%27 stroke-linejoin=%27round%27 d=%27M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253%27/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-base-100">

<div id="admin-nav"></div>


<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <!-- Breadcrumb -->
  <nav class="text-sm breadcrumbs mb-6">
    <ul>
      <li><a href="/admin/dashboard/" class="text-base-content/60 hover:text-primary">Dashboard</a></li>
      <li><a href="/admin/users/" class="text-base-content/60 hover:text-primary">Users</a></li>
      <li class="text-base-content font-medium" id="bcUser">—</li>
    </ul>
  </nav>

  <div id="loading" class="space-y-4" role="status" aria-busy="true" aria-label="Memuat">
    <div class="skeleton h-32 w-full"></div>
    <div class="skeleton h-48 w-full"></div>
  </div>
  <div id="errorState" class="hidden alert alert-error"><span class="material-symbols-outlined">error</span><span id="errMsg"></span></div>

  <div id="content" class="hidden">

    <!-- User Info Card -->
    <div class="card bg-base-100 border border-base-200 mb-6">
      <div class="card-body">
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-6">
          <div class="flex items-start gap-4">
            <div class="avatar placeholder">
              <div class="bg-gradient-to-br from-primary to-secondary text-primary-content rounded-full w-16">
                <span class="text-xl font-bold" id="userInitials">—</span>
              </div>
            </div>
            <div>
              <h1 class="text-2xl font-bold" id="userName">—</h1>
              <p class="text-base-content/60" id="userEmail">—</p>
              <div class="flex flex-wrap items-center gap-2 mt-2" id="badges"></div>
              <p class="text-xs text-base-content/50 mt-2">Terdaftar sejak <span id="userJoined">—</span></p>
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <button id="toggleActiveBtn" class="btn btn-sm btn-outline w-full gap-1">
              <span class="material-symbols-outlined" style="font-size:16px" id="toggleIcon">block</span>
              <span id="toggleText">Toggle</span>
            </button>
            <div class="flex gap-1">
              <select id="roleSelect" class="select select-sm select-bordered flex-1">
                <option value="user">User</option>
                <option value="admin">Admin</option>
              </select>
              <button id="changeRoleBtn" class="btn btn-sm btn-primary">Ubah Role</button>
            </div>
            <div id="actionMsg" class="hidden alert alert-success text-xs"></div>
            <div id="actionErr" class="hidden alert alert-error text-xs"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress Section -->
    <div class="card bg-base-100 border border-base-200">
      <div class="card-body">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Progress Modul</h2>
          <div class="flex items-center gap-2">
            <progress class="progress progress-primary w-32" id="progressBar"></progress>
            <span class="text-sm font-medium"><span id="progressDone">—</span>/<span id="progressTotal">—</span></span>
          </div>
        </div>
        <div id="progressEmpty" class="hidden text-center py-8">
          <span class="material-symbols-outlined text-4xl text-base-content/20 mb-2">school</span>
          <p class="text-base-content/50">User belum mengunjungi modul apapun.</p>
        </div>
        <div id="progressTableWrap" class="hidden overflow-x-auto">
          <table class="table table-sm">
            <thead>
              <tr><th scope="col">Modul</th><th scope="col">Track</th><th scope="col">Status</th><th scope="col">Terakhir Dikunjungi</th><th scope="col">Diselesaikan</th></tr>
            </thead>
            <tbody id="progressRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/admin-nav.js"></script>
<script>
Auth.requireProfile();

const id = new URLSearchParams(location.search).get("id");
if (!id) location.href = "/admin/users/";

function fmtDate(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleString("id-ID", {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); } catch { return s; }
}

function showAction(ok, msg) {
  const okBox = document.getElementById("actionMsg");
  const errBox = document.getElementById("actionErr");
  if (ok) { okBox.textContent = msg; okBox.classList.remove("hidden"); errBox.classList.add("hidden"); }
  else { errBox.textContent = msg; errBox.classList.remove("hidden"); okBox.classList.add("hidden"); }
}

async function load() {
  try {
    const d = await Api.get("/admin/users/" + encodeURIComponent(id));
    const u = d.user;
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");
    document.getElementById("bcUser").textContent = u.name;
    document.getElementById("userName").textContent = u.name;
    document.getElementById("userEmail").textContent = u.email;
    document.getElementById("userInitials").textContent = (u.name || "?").slice(0,2).toUpperCase();
    document.getElementById("userJoined").textContent = fmtDate(u.created_at);

    // Badges
    const badges = document.getElementById("badges");
    badges.innerHTML = "";
    const roleBadge = document.createElement("span");
    roleBadge.className = "badge gap-1 " + (u.role === "admin" ? "badge-warning" : "badge-ghost");
    roleBadge.innerHTML = `<span class="material-symbols-outlined" style="font-size:14px">${u.role === "admin" ? "shield_person" : "person"}</span>`;
    roleBadge.appendChild(document.createTextNode(u.role === "admin" ? " Admin" : " User"));
    badges.appendChild(roleBadge);
    const statusBadge = document.createElement("span");
    statusBadge.className = "badge gap-1 " + (u.is_active ? "badge-success" : "badge-error");
    statusBadge.textContent = u.is_active ? "Aktif" : "Nonaktif";
    badges.appendChild(statusBadge);
    if (u.affiliation) {
      const affBadge = document.createElement("span");
      affBadge.className = "badge badge-outline gap-1";
      affBadge.innerHTML = `<span class="material-symbols-outlined" style="font-size:14px">apartment</span>`;
      affBadge.appendChild(document.createTextNode(" " + u.affiliation));
      badges.appendChild(affBadge);
    }
    if (u.selected_track) {
      const trackBadge = document.createElement("span");
      trackBadge.className = "badge badge-info badge-outline";
      trackBadge.textContent = "Track: " + u.selected_track;
      badges.appendChild(trackBadge);
    }

    // Toggle button text
    const ti = document.getElementById("toggleIcon");
    const tt = document.getElementById("toggleText");
    const tb = document.getElementById("toggleActiveBtn");
    if (u.is_active) {
      ti.textContent = "block";
      tt.textContent = "Nonaktifkan";
      tb.classList.add("btn-error");
      tb.classList.remove("btn-success");
    } else {
      ti.textContent = "check_circle";
      tt.textContent = "Aktifkan";
      tb.classList.add("btn-success");
      tb.classList.remove("btn-error");
    }
    document.getElementById("roleSelect").value = u.role;

    // Progress bar
    document.getElementById("progressDone").textContent = d.completed || 0;
    document.getElementById("progressTotal").textContent = d.total || 10;
    document.getElementById("progressBar").value = d.completed || 0;
    document.getElementById("progressBar").max = d.total || 10;

    // Progress table
    const progresses = d.progresses || [];
    if (progresses.length === 0) {
      document.getElementById("progressEmpty").classList.remove("hidden");
    } else {
      const rows = document.getElementById("progressRows");
      progresses.forEach((p) => {
        const tr = document.createElement("tr");
        tr.className = "hover";
        tr.innerHTML = `
          <td class="font-medium"></td>
          <td class="text-xs"></td>
          <td><span class="badge badge-sm gap-1"></span></td>
          <td class="text-base-content/60 text-sm"></td>
          <td class="text-base-content/60 text-sm"></td>`;
        const tds = tr.querySelectorAll("td");
        tds[0].textContent = p.module_slug;
        tds[1].textContent = p.track;
        const sb = tds[2].querySelector(".badge");
        if (p.completed) {
          sb.className += " badge-success";
          sb.innerHTML = `<span class="material-symbols-outlined" style="font-size:12px">check</span>`;
          sb.appendChild(document.createTextNode(" Selesai"));
        } else {
          sb.className += " badge-ghost";
          sb.textContent = "Belum";
        }
        tds[3].textContent = fmtDate(p.last_visited_at);
        tds[4].textContent = p.completed_at ? fmtDate(p.completed_at) : "—";
        rows.appendChild(tr);
      });
      document.getElementById("progressTableWrap").classList.remove("hidden");
    }
  } catch (err) {
    document.getElementById("loading").classList.add("hidden");
    const e = document.getElementById("errorState");
    document.getElementById("errMsg").textContent = err.status === 404 ? "User tidak ditemukan"
      : err.status === 403 ? "Akses admin diperlukan"
      : (err.message || "Gagal memuat user");
    e.classList.remove("hidden");
  }
}

document.getElementById("toggleActiveBtn").addEventListener("click", async () => {
  if (!await UI.confirm({ title: "Ubah Status Akun", message: "Yakin ubah status aktif user ini?",
      confirmText: "Ya, ubah", danger: true })) return;
  try {
    const r = await Api.post("/admin/users/" + encodeURIComponent(id) + "/toggle-active");
    showAction(true, "Status diubah menjadi: " + (r.is_active ? "Aktif" : "Nonaktif"));
    setTimeout(load, 500);
  } catch (err) { showAction(false, err.message || "Gagal toggle"); }
});

document.getElementById("changeRoleBtn").addEventListener("click", async () => {
  const role = document.getElementById("roleSelect").value;
  if (!await UI.confirm({ title: "Ubah Role", message: "Ubah role user ini ke '" + role + "'?",
      confirmText: "Ya, ubah" })) return;
  try {
    const r = await Api.post("/admin/users/" + encodeURIComponent(id) + "/change-role", { role });
    showAction(true, "Role diubah menjadi: " + r.role);
    setTimeout(load, 500);
  } catch (err) { showAction(false, err.message || "Gagal update role"); }
});

load();
</script>
</body>
</html>
