<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- theme-init: honor saved theme before paint (no FOUC) -->
  <script>try{var t=localStorage.getItem('slr_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>404 — Nulis</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B19CD8%27 stroke-width=%272%27%3E%3Cpath stroke-linecap=%27round%27 stroke-linejoin=%27round%27 d=%27M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
  <script>
    // Redirect /modul/SLUG (inline content link format) ke SPA /modul/?slug=SLUG
    // Inline links di markdown content (mis. "klik [Modul 1](/modul/01-fondasi)")
    // akan 404 di GitHub Pages karena tidak ada file fisik — fallback ini route
    // ke SPA dengan slug yang benar. Optional: append &track= dari path-2 segment.
    (function () {
      var path = location.pathname;
      var m = path.match(/^\/modul\/([^\/]+)\/?$/);
      if (m && m[1] !== "index.html") {
        var slug = decodeURIComponent(m[1]);
        var qs = location.search ? location.search + "&slug=" + slug : "?slug=" + slug;
        location.replace("/modul/" + qs);
      }
    })();
  </script>
</head>
<body class="bg-base-100 min-h-screen flex items-center justify-center px-4">
  <main class="text-center max-w-md">
    <p class="text-7xl font-bold opacity-20 mb-2">404</p>
    <h1 class="text-2xl font-semibold mb-2">Halaman tidak ditemukan</h1>
    <p class="opacity-70 mb-6">URL yang Anda buka tidak ada di Nulis.</p>
    <div class="flex gap-2 justify-center">
      <a href="/" class="btn btn-ghost">Beranda</a>
      <a href="/home/" class="btn btn-primary">Daftar Modul</a>
    </div>
  </main>
</body>
</html>
