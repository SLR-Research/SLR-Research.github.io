<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar — SLR AI Guide</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B19CD8%27 stroke-width=%272%27%3E%3Cpath stroke-linecap=%27round%27 stroke-linejoin=%27round%27 d=%27M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253%27/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.13?plugins=typography"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-base-200">

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary/10 to-base-200 p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">

      <!-- Brand -->
      <div class="text-center mb-6">
        <img src="/assets/images/logo-rpi.png" alt="RPI Institute" class="h-12 w-auto mx-auto mb-3">
        <h1 class="text-xl font-bold">Daftar Akun</h1>
        <p class="text-base-content/60 text-sm mt-1">Buat akun untuk mengakses seluruh modul SLR</p>
      </div>

      <!-- Error message -->
      <div id="errorAlert" class="hidden alert alert-error mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span id="errorMsg"></span>
      </div>

      <!-- Register Form -->
      <form id="registerForm" class="space-y-4" novalidate>
        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Nama Lengkap</span></label>
          <input type="text" name="name" placeholder="Dr. Budi Santoso" class="input input-bordered w-full" required autofocus autocomplete="name">
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Email</span></label>
          <input type="email" name="email" placeholder="nama@email.com" class="input input-bordered w-full" required autocomplete="email">
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Afiliasi / Institusi</span></label>
          <input type="text" name="affiliation" placeholder="Universitas Indonesia" class="input input-bordered w-full" autocomplete="organization">
          <label class="label"><span class="label-text-alt text-base-content/50">Opsional — Nama universitas atau institusi Anda</span></label>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Password</span></label>
          <input type="password" name="password" placeholder="Min. 8 karakter" class="input input-bordered w-full" required minlength="8" maxlength="128" autocomplete="new-password">
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Konfirmasi Password</span></label>
          <input type="password" name="confirm_password" placeholder="Ulangi password" class="input input-bordered w-full" required autocomplete="new-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-full mt-2">Buat Akun</button>
      </form>

      <div class="divider text-xs">atau daftar dengan</div>
      <div id="googleSignIn" class="flex justify-center"></div>

      <div class="divider text-xs">Sudah punya akun?</div>

      <a href="/login/" class="btn btn-outline w-full">Login</a>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script>
Auth.requireGuest();

const form = document.getElementById("registerForm");
const errAlert = document.getElementById("errorAlert");
const errMsg = document.getElementById("errorMsg");
const submitBtn = document.getElementById("submitBtn");

function showError(msg) {
  errMsg.textContent = msg;
  errAlert.classList.remove("hidden");
}

// Google SSO init (sama logic dengan login page).
function initGoogleSSO() {
  const clientId = window.GOOGLE_CLIENT_ID;
  if (!clientId || !window.google || !google.accounts) return;
  google.accounts.id.initialize({
    client_id: clientId,
    callback: async (response) => {
      errAlert.classList.add("hidden");
      try {
        const data = await Api.post("/auth/google", { id_token: response.credential });
        if (data && data.token) {
          Auth.setToken(data.token);
          if (data.user) Auth.setUser(data.user);
          location.href = data.redirect || "/select-track/";
        } else { showError("Response Google login tidak valid"); }
      } catch (err) { showError(err.message || "Google login gagal"); }
    },
  });
  google.accounts.id.renderButton(document.getElementById("googleSignIn"), {
    theme: "outline", size: "large", shape: "rectangular", width: 320, text: "signup_with",
  });
}
const _gisInterval = setInterval(() => {
  if (window.google && google.accounts) { clearInterval(_gisInterval); initGoogleSSO(); }
}, 100);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errAlert.classList.add("hidden");
  const fd = new FormData(form);
  if (fd.get("password") !== fd.get("confirm_password")) {
    showError("Konfirmasi password tidak cocok");
    return;
  }
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="loading loading-spinner loading-sm"></span> Memproses...';
  try {
    const res = await Api.post("/register", {
      name: fd.get("name"),
      email: fd.get("email"),
      affiliation: fd.get("affiliation") || "",
      password: fd.get("password"),
    });
    if (res && res.token) {
      Auth.setToken(res.token);
      if (res.user) Auth.setUser(res.user);
      location.href = "/select-track/";
    } else {
      showError("Response tidak valid dari server");
    }
  } catch (err) {
    showError(err.message || "Registrasi gagal");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Buat Akun";
  }
});
</script>
</body>
</html>
